extent.reporter.spark.start = true
extent.reporter.spark.out = test-output/SparkReport/Spark.html

# Report title
extent.reporter.spark.config.theme = dark
extent.reporter.spark.config.documentTitle = Selenium BDD Test Report
extent.reporter.spark.config.reportName = Regression Suite - Galaxy Z Fold & Login
extent.reporter.spark.config.timeStampFormat = dd/MM/yyyy hh:mm:ss
extent.reporter.spark.config.encoding = UTF-8

# Enable system info
extent.reporter.spark.config.systemInfo.os = ${os.name}
extent.reporter.spark.config.systemInfo.java = ${java.version}
extent.reporter.spark.config.systemInfo.user = ${user.name}